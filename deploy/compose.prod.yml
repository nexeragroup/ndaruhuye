name: ${COMPOSE_PROJECT_NAME}

services:
  web:
    container_name: ${WEB_CONTAINER_NAME}
    image: ${WEB_IMAGE}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: prod
    environment:
      NODE_ENV: production
      PORT: ${WEB_CONTAINER_PORT}
    ports:
      - 127.0.0.1:${WEB_HOST_PORT}:${WEB_CONTAINER_PORT}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('node:http').get({host:'127.0.0.1',port:process.env.PORT,path:'/',headers:{host:'ndaruhuye.nexeragroup.rw'}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ndaruhuye

networks:
  ndaruhuye:
    name: ${WEB_NETWORK_NAME}
    external: true
